<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PM App</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f7f8fb;
      color: #032147;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      border: 1px solid rgba(3, 33, 71, 0.08);
      border-radius: 24px;
      padding: 48px 56px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(3, 33, 71, 0.12);
      text-align: center;
      max-width: 480px;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p  { margin: 0; color: #888; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      margin-top: 24px;
      background: #209dd7;
      color: #fff;
      border-radius: 999px;
      padding: 6px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PM App</h1>
    <p>Backend scaffolding is running. The full Kanban UI will be served here in Part 3.</p>
    <a class="badge" href="/api/health">/api/health</a>
  </div>
</body>
</html>
